[package]
name = "cftool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cftool_cli"
path = "src/lib.rs"

[[bin]]
name = "cftool"
path = "src/main.rs"

[dependencies]
cftool-core = { path = "../core" }
cftool-warp = { path = "../modules/warp" }
cftool-cdn = { path = "../modules/cdn" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = { version = "1", features = ["serde"] }
tabled = "0.22"
dirs = { workspace = true }
time = { workspace = true }

[features]
mock = ["cftool-core/mock", "cftool-warp/mock", "cftool-cdn/mock"]
