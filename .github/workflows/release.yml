name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate tag name
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'. Use vMAJOR.MINOR.PATCH[-beta.N|-rc.N|-alpha.N]"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.check.outputs.tag }}
          persist-credentials: false
      - name: Verify tag matches the manifest at that commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.tag }}"
          version="${version#v}"
          manifest_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cftool"))')
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag ${{ steps.check.outputs.tag }} disagrees with crate version $manifest_version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Verified ${{ steps.check.outputs.tag }} (version $version, prerelease=$prerelease)"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: cftool-${{ needs.verify.outputs.tag }}-linux-x86_64.tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: cftool-${{ needs.verify.outputs.tag }}-windows-x86_64.zip
          - os: macos-15
            target: aarch64-apple-darwin
            archive: cftool-${{ needs.verify.outputs.tag }}-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      attestations: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - name: Install Linux GUI link libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxcb1-dev libfreetype-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p cftool -p cftool-gui
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cftool dist/
          cp target/${{ matrix.target }}/release/cftool-gui dist/
          tar -czf "${{ matrix.archive }}" -C dist cftool cftool-gui
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/cftool.exe dist/
          Copy-Item target/${{ matrix.target }}/release/cftool-gui.exe dist/
          Compress-Archive -Path dist/cftool.exe, dist/cftool-gui.exe -DestinationPath "${{ matrix.archive }}"
          (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
          subject-name: ${{ matrix.archive }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: cftool ${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'false' && 'true' || 'false' }}
          generate_release_notes: true
          body: |
            ${{ needs.verify.outputs.prerelease == 'true' && '> **Pre-release.** Use for testing only.' || '' }}
            Verify downloads with `sha256sum -c SHA256SUMS`.
            Build provenance: `gh attestation verify <archive> --repo mahyartdb/cloudflare-tool`.
          files: |
            artifacts/*
          fail_on_unmatched_files: true

  crates:
    name: Publish to crates.io
    needs: [verify, publish]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install Linux GUI link libraries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxcb1-dev libfreetype-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"

          published() {
            curl --fail --silent --show-error -o /dev/null \
              --user-agent "cftool-release-ci/$version" \
              "https://crates.io/api/v1/crates/$1/$version"
          }

          publish() {
            local crate="$1"
            if published "$crate"; then
              echo "::notice::$crate $version already on crates.io; skipping"
              return 0
            fi
            local output status=0
            output=$(cargo publish -p "$crate" --locked 2>&1) || status=$?
            if [ "$status" -eq 0 ] || published "$crate"; then
              printf '%s\n' "$output"
              return 0
            fi
            if ! grep -qiE 'not found|no matching package|unresolved|failed to select' <<<"$output"; then
              printf '%s\n' "$output"
              echo "::error::crates.io rejected $crate $version; not retrying a permanent error"
              return 1
            fi
            local deadline=$((SECONDS + 900))
            while (( SECONDS < deadline )); do
              echo "::notice::waiting for crates.io index propagation before retrying $crate"
              sleep 30
              output=$(cargo publish -p "$crate" --locked 2>&1) || status=$?
              if [ "$status" -eq 0 ] || published "$crate"; then
                printf '%s\n' "$output"
                return 0
              fi
              if ! grep -qiE 'not found|no matching package|unresolved|failed to select' <<<"$output"; then
                printf '%s\n' "$output"
                echo "::error::crates.io rejected $crate $version; not retrying a permanent error"
                return 1
              fi
            done
            echo "::error::timed out waiting to publish $crate $version"
            return 1
          }

          publish cftool-core
          publish cftool-warp
          publish cftool-cdn
          publish cftool
          publish cftool-gui
